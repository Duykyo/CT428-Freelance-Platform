<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập – WorkLance</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg wl-navbar">
  <div class="container">
    <a class="navbar-brand wl-brand" href="index.html">Work<span>Lance</span></a>
    <div class="d-flex gap-2">
      <a href="projects.html" class="btn btn-link">Dự án</a>
      <a href="register.html" class="btn btn-primary">Đăng ký</a>
    </div>
  </div>
</nav>

<main class="wl-auth-wrap">
  <div class="container">
    <div class="wl-auth-card mx-auto" style="max-width: 920px;">
      <div class="row g-0">
        <div class="col-md-5 d-none d-md-block">
          <div class="wl-auth-side d-flex flex-column justify-content-center">
            <h3 class="fw-bold mb-3">Chào mừng trở lại!</h3>
            <p class="mb-4" style="opacity:.9">Đăng nhập để quản lý dự án, theo dõi đề xuất và tìm công việc mới.</p>
            <ul class="list-unstyled mb-0">
              <li class="mb-2"><i class="bi bi-check-circle-fill me-2"></i>Đăng và quản lý dự án</li>
              <li class="mb-2"><i class="bi bi-check-circle-fill me-2"></i>Gửi đề xuất nhanh chóng</li>
              <li><i class="bi bi-check-circle-fill me-2"></i>Theo dõi trạng thái công việc</li>
            </ul>
          </div>
        </div>

        <div class="col-md-7">
          <div class="p-4 p-md-5">
            <h3 class="fw-bold mb-1">Đăng nhập</h3>
            <p class="wl-muted mb-4">Nhập thông tin tài khoản của bạn</p>

            <form action="#" novalidate>
              <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                  <input type="email" id="email" class="form-control" placeholder="ban@example.com" required>
                </div>
              </div>

              <div class="mb-3">
                <label for="password" class="form-label fw-semibold">Mật khẩu</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
              </div>

              <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="remember">
                  <label class="form-check-label small" for="remember">Ghi nhớ đăng nhập</label>
                </div>
                <a href="#" class="small">Quên mật khẩu?</a>
              </div>

              <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary btn-lg">Đăng nhập</button>
              </div>
            </form>

            <p class="text-center mb-0 wl-muted">Chưa có tài khoản? <a href="register.html" class="fw-semibold">Đăng ký ngay</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
